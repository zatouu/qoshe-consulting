# Nginx host config — place in /etc/nginx/sites-available/qoshe.conf
# then symlink: sudo ln -s /etc/nginx/sites-available/qoshe.conf /etc/nginx/sites-enabled/
# and reload:   sudo nginx -t && sudo systemctl reload nginx
#
# After setup, run setup-certbot.sh to enable HTTPS.
# Certbot will edit this file to add SSL and redirect HTTP→HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name qosheconsulting.com www.qosheconsulting.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
